name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES: docs/releases/${{ github.ref_name }}.md
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RELEASE_NOTES"
