name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            testbench: '^8.0'
            advisory-block: '0'
          - php: '8.2'
            testbench: '^9.0'
            advisory-block: '0'
          - php: '8.3'
            testbench: '^10.0'
            advisory-block: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - name: Select Testbench version
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update
      # Legacy Laravel versions are tested only for compatibility in an isolated runner.
      # Keep advisory blocking enabled for the current Laravel 12 dependency set.
      - name: Install dependencies
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.advisory-block }}
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: Validate package metadata
        run: composer validate --strict --no-check-lock
      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer test
      - run: composer test:unit
